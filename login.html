<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bejelentkezés - Zöld Paradicsom</title>
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .login-container { max-width: 400px; margin: 100px auto; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 8px; }
        #error-message { color: red; display: none; margin-top: 10px; }
    </style>
</head>
<body class="bg-light">

<div class="container">
    <div class="login-container bg-white">
        <h3 class="text-center mb-4">Partner Bejelentkezés</h3>
        
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email cím</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Jelszó</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-success btn-block mt-3" id="login-btn">Bejelentkezés</button>
            <p id="error-message">Hibás email vagy jelszó!</p>
        </form>
    </div>
</div>

<script>
    const supabaseUrl = 'https://foitlxqsovagutbfhmsz.supabase.co';
    const supabaseKey = 'sb_publishable_P_Km4KGNEstVsaVxpqgfBQ_SffKOLBj';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    document.getElementById('login-form').addEventListener('submit', async function(e) {
        e.preventDefault(); 
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('error-message');
        const loginBtn = document.getElementById('login-btn');

        loginBtn.disabled = true;
        loginBtn.innerText = "Kérlek várj...";
        errorMsg.style.display = "none";

        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            errorMsg.style.display = "block";
            errorMsg.innerText = "Hiba: " + error.message;
            loginBtn.disabled = false;
            loginBtn.innerText = "Bejelentkezés";
        } else {
            window.location.href = 'rendeles.html';
        }
    });
</script>
</body>
</html>
