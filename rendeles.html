<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rendelés - Zöld Paradicsom</title>
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row">
        <div class="col-md-8 offset-md-2 bg-white p-5 rounded shadow-sm">
            <h2 class="mb-3">Napi Rendelés Leadása</h2>
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                <p class="mb-0">Bejelentkezve mint: <strong id="user-email">Betöltés...</strong></p>
                <button id="logout-btn" class="btn btn-sm btn-danger">Kijelentkezés</button>
            </div>

            <form id="order-form">
                <div class="row mb-3">
                    <div class="col-md-5">
                        <label>Termék</label>
                        <select id="product" class="form-control">
                            <option value="Alma piros">Alma piros</option>
                            <option value="Banán">Banán</option>
                            <option value="Cékla">Cékla</option>
                            <option value="Citrom">Citrom</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label>Mennyiség</label>
                        <input type="number" id="quantity" class="form-control" required min="1">
                    </div>
                    <div class="col-md-4">
                        <label>Mértékegység</label>
                        <select id="unit" class="form-control">
                            <option value="kg">kg</option>
                            <option value="#"># (Láda)</option>
                            <option value="db">db</option>
                            <option value="cs">cs</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-success btn-lg btn-block">Hozzáadás a rendeléshez</button>
            </form>

            <div id="status-message" class="alert alert-success mt-4" style="display:none;">Sikeresen rögzítve!</div>
        </div>
    </div>
</div>

<script>
    const supabaseUrl = 'https://foitlxqsovagutbfhmsz.supabase.co';
    const supabaseKey = 'sb_publishable_P_Km4KGNEstVsaVxpqgfBQ_SffKOLBj';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    // Authentication Guard
    async function checkUser() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        
        if (!session) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('user-email').innerText = session.user.email;
        }
    }
    
    checkUser();

    // Logout function
    document.getElementById('logout-btn').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        window.location.href = 'login.html';
    });

    // Submit Order
    document.getElementById('order-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const product = document.getElementById('product').value;
        const quantity = document.getElementById('quantity').value;
        const unit = document.getElementById('unit').value;
        
        const { data: { user } } = await supabaseClient.auth.getUser();
        const restaurantName = user.email.split('@')[0]; 

        const { data, error } = await supabaseClient
            .from('orders')
            .insert([
                { 
                    restaurant_name: restaurantName, 
                    product_name: product, 
                    quantity: quantity, 
                    unit: unit 
                }
            ]);

        if (error) {
            alert("Hiba történt: " + error.message);
        } else {
            const statusMsg = document.getElementById('status-message');
            statusMsg.style.display = "block";
            setTimeout(() => statusMsg.style.display = "none", 3000);
            
            document.getElementById('quantity').value = '';
        }
    });
</script>
</body>
</html>
