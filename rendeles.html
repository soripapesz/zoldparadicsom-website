<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bejelentkezés - Zöld Paradicsom</title>
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .login-container { max-width: 400px; margin: 100px auto; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 8px; }
        #error-message { color: red; display: none; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="login-container bg-light">
        <h3 class="text-center mb-4">Partner Bejelentkezés</h3>
        
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email cím</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Jelszó</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-success btn-block mt-3" id="login-btn">Bejelentkezés</button>
            <p id="error-message">Hibás email vagy jelszó!</p>
        </form>
    </div>
</div>

<script>
    // 1. Initialize Supabase
    const supabaseUrl = 'https://foitlxqsovagutbfhmsz.supabase.co';
    const supabaseKey = 'sb_publishable_P_Km4KGNEstVsaVxpqgfBQ_SffKOLBj';

    // CHANGED: Renamed to supabaseClient
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    // 2. Authentication Guard (Check if user is logged in)
    async function checkUser() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        
        if (!session) {
            // Not logged in! Redirect to login.
            window.location.href = 'login.html';
        } else {
            // Display user email
            document.getElementById('user-email').innerText = session.user.email;
        }
    }

    // Run the check immediately
    checkUser();

    // 3. Handle Logout
    document.getElementById('logout-btn').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        window.location.href = 'login.html';
    });

    // 4. Submit an Order to the Database
    document.getElementById('order-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const product = document.getElementById('product').value;
        const quantity = document.getElementById('quantity').value;
        const unit = document.getElementById('unit').value;
        
        const { data: { user } } = await supabaseClient.auth.getUser();
        const restaurantName = user.email.split('@')[0]; 

        const { data, error } = await supabaseClient
            .from('orders')
            .insert([
                { 
                    restaurant_name: restaurantName, 
                    product_name: product, 
                    quantity: quantity, 
                    unit: unit 
                }
            ]);

        if (error) {
            alert("Hiba történt: " + error.message);
        } else {
            const statusMsg = document.getElementById('status-message');
            statusMsg.style.display = "block";
            setTimeout(() => statusMsg.style.display = "none", 3000);
            
            document.getElementById('quantity').value = '';
        }
    });
</script>

</body>
</html>
